# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Requests that would combine principal and resource policies from different policy versions are rejected

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: User
  policyVersion: default
  roles:
    - user
  attr:
    isActive: true

tests:
  - resource:
      kind: additive
      policyVersion: "2025_11"
    action: POST
    # The principal policy is version "default" while the resource policy is
    # version "2025_11". Both policies exist, so the request must fail with a
    # policy version mismatch instead of producing a plan. The legacy outputs
    # below are retained only to document the pre-fix behaviour.
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        POST: ""

  - resource:
      kind: additive
      policyVersion: "2025_11"
    action: GET
    # See the note above: this mixed-version request is rejected as well.
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        GET: ""
